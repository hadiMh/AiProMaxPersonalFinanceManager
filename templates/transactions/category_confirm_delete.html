{% extends "base.html" %}

{% block title %}حذف دسته{% endblock %}

{% block content %}
<h2>حذف دسته‌بندی</h2>
<p>آیا از حذف «{{ object.name }}» مطمئن هستید؟ تراکنش‌های قبلی حذف نمی‌شوند.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">بله، حذف شود</button>
    <a class="btn" href="{% url 'transactions:category_list' %}">انصراف</a>
</form>
{% endblock %}
